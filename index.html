<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No title and no description tag here on purpose.
         Every route sets its own through the Head component (vite-react-ssg).
         A static one in this template does not get replaced — it is appended
         to, so each prerendered page shipped two titles and two descriptions,
         one of them German on an English page. A crawler picking the wrong one
         is a coin flip we do not need to take.
         (Written without angle brackets deliberately: tags inside this comment
         survive the head processing and reappear as real, empty tags.) -->
    <!-- Geist is self-hosted (public/fonts, one variable file per subset), so
         the first paint does not wait on a third-party stylesheet and no
         visitor IP reaches Google. Preloaded because every headline uses it. -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
