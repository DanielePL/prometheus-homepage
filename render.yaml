services:
  - type: web
    runtime: static
    name: prometheus-coach
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
    routes:
      # Prerendered pages first — order matters, the first match wins.
      #
      # Without these, the catch-all below swallowed every path except "/": a
      # request for /studios was answered with index.html, so a crawler read the
      # homepage under the studios URL, complete with the homepage's canonical
      # tag pointing at "/". The page effectively did not exist for search,
      # while looking perfectly fine in a browser — React Router renders the
      # right page client-side once the bundle loads, which is exactly why it
      # went unnoticed.
      #
      # scripts/postbuild-pretty-urls.mjs writes each page a second time as
      # <slug>/index.html, which is what these point at — that copy also makes
      # the URLs work if this file is ignored (Render only applies render.yaml
      # to Blueprint-created services).
      # Keep in sync with ssgOptions.includedRoutes in vite.config.js.
      - type: rewrite
        source: /studios
        destination: /studios/index.html
      - type: rewrite
        source: /enterprise
        destination: /enterprise/index.html
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /trainerize-alternative
        destination: /trainerize-alternative/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /impressum
        destination: /impressum/index.html
      - type: rewrite
        source: /goodbye
        destination: /goodbye/index.html
      # The three routes that exist only in the browser and must boot the app:
      # an OAuth return, a Stripe return, and the investor pitch.
      - type: rewrite
        source: /auth/*
        destination: /index.html
      - type: rewrite
        source: /stripe/*
        destination: /index.html
      - type: rewrite
        source: /growth
        destination: /index.html
      # No catch-all on purpose. Anything left over matches no file, and the
      # host answers with dist/404.html and a real 404 status. A blanket
      # "/* -> /index.html" turns every mistyped URL into a 200 that serves the
      # homepage — a soft 404, which reads to a crawler as an unlimited supply
      # of duplicate homepages, and which hides broken internal links because
      # nothing ever visibly fails.
    envVars:
      - key: NODE_VERSION
        value: 20
